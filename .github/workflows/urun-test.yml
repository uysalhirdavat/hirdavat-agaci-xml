
name: Urun Baglantilari Testi

on:
  workflow_dispatch:

jobs:
  urun-testi:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri yukle
        run: pip install -r requirements.txt

      - name: Urun baglantilarini kontrol et
        run: python urunleri_cek.py

      - name: Sonuclari kaydet
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: urun-baglantilari
          path: urun_baglantilari.csv
          if-no-files-found: error
