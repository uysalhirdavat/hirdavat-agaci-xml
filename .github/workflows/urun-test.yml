
name: Urun Baglantilari Testi

on:
  workflow_dispatch:

jobs:
  urun-testi:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri yukle
        run: pip install -r requirements.txt

      - name: Urun baglantilarini kontrol et
        run: python urunleri_cek.py

      - name: Sonuclari kaydet
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hirdavat-agaci-urun-raporu
          path: |
            urun_baglantilari.csv
            kategori_raporu.csv
          if-no-files-found: error
