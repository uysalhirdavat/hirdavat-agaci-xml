
name: Urun Detay Testi (50 Urun)

on:
  workflow_dispatch:

jobs:
  urun-detay-testi:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri yukle
        run: pip install -r requirements.txt

      - name: Urun baglantilarini olustur
        run: python urunleri_cek.py

      - name: Farkli markalardan 50 urunun detaylarini cek
        run: python urun_detaylarini_cek.py

      - name: Test raporunu kaydet
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hirdavat-agaci-50-urun-test
          path: urun_detay_50_test.csv
          if-no-files-found: error
